name: Generate Demo GIFs

on:
  push:
    branches: [ main ]
    paths:
      - 'examples/**'
      - 'demos/**'
      - 'gifdoc.yml'
  workflow_dispatch:
    inputs:
      demo_name:
        description: 'Specific demo to generate (leave empty for all)'
        required: false
        type: string

jobs:
  generate-demos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build GifDoc
        run: npm run build --workspaces

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate demo GIFs
        run: |
          if [ -n "${{ github.event.inputs.demo_name }}" ]; then
            node packages/cli/bin/gifdoc.js generate --demo "${{ github.event.inputs.demo_name }}"
          else
            node packages/cli/bin/gifdoc.js generate
          fi
        continue-on-error: true

      - name: Upload generated GIFs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: demo-gifs
          path: |
            demos/**/*.gif
            examples/**/demos/**/*.gif
          retention-days: 30
          if-no-files-found: warn

      - name: Commit and push GIFs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add demos/**/*.gif examples/**/demos/**/*.gif || true

          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: update demo GIFs [skip ci]" -m "Generated with GifDoc 🤖"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR with GIF preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find all generated GIFs
            const gifFiles = [];
            function findGifs(dir) {
              if (!fs.existsSync(dir)) return;
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat.isDirectory()) {
                  findGifs(filePath);
                } else if (file.endsWith('.gif')) {
                  gifFiles.push(filePath);
                }
              }
            }
            findGifs('demos');
            findGifs('examples');

            if (gifFiles.length > 0) {
              let comment = '## 🎬 Generated Demo GIFs\n\n';
              comment += `Generated ${gifFiles.length} demo GIF(s):\n\n`;
              gifFiles.forEach(gif => {
                comment += `- \`${gif}\`\n`;
              });
              comment += '\n📦 Download artifacts to view the GIFs.\n';

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
