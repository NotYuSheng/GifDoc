name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Build and test the project
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build --workspaces

      - name: Run tests
        run: npm run test --workspaces --if-present

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-packages
          path: |
            packages/*/dist
          retention-days: 7

  # Lint and type check
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit --project packages/core/tsconfig.json

      - name: Check for TypeScript errors in CLI
        run: npx tsc --noEmit --project packages/cli/tsconfig.json

  # Test CLI commands
  test-cli:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build --workspaces

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test CLI help command
        run: node packages/cli/bin/gifdoc.js --help

      - name: Test CLI init in temp directory
        run: |
          mkdir -p /tmp/gifdoc-test-${{ github.run_id }}
          cd /tmp/gifdoc-test-${{ github.run_id }}
          node $GITHUB_WORKSPACE/packages/cli/bin/gifdoc.js init <<EOF
          y
          n
          EOF

      - name: Test CLI validate command
        run: |
          cd /tmp/gifdoc-test-${{ github.run_id }}
          node $GITHUB_WORKSPACE/packages/cli/bin/gifdoc.js validate

      - name: Verify created files
        run: |
          cd /tmp/gifdoc-test-${{ github.run_id }}
          test -f gifdoc.yml || exit 1
          test -f demos/example.spec.ts || exit 1
          test -d demos || exit 1
          echo "All expected files created successfully"
